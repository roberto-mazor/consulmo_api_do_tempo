<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Dev - Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-blue-400 tracking-tight">Weather Dashboard</h1>
            <p class="text-gray-400 mt-2 italic">Consumindo dados em tempo real</p>
        </header>

        

        <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl mb-8 flex flex-col md:flex-row gap-4 items-center">
            <div class="flex-1 w-full">
                <input type="text" id="inputCidade" placeholder="Digite o nome da cidade (ex: Americana)"
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <button id="btnBuscar"
                class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-10 rounded-lg transition-all active:scale-95 shadow-lg">
                Buscar Clima
            </button>
        </div>

        <div id="statusCidade"
            class="hidden mb-6 p-4 bg-blue-900/30 border border-blue-500/50 rounded-lg text-blue-200 font-medium text-center">
        </div>

        <!-- CARD Temperatura -->
        <div id="cardDestaque" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-2xl shadow-lg border border-blue-400/30">
                <p class="text-blue-200 text-sm uppercase font-bold tracking-wider">Temperatura Atual</p>
                <h2 id="tempAtual" class="text-5xl font-black mt-2">--°C</h2>
            </div>
        
            <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
                <p class="text-gray-400 text-sm uppercase font-bold">Máxima do Dia</p>
                <h2 id="tempMax" class="text-3xl font-bold mt-2 text-orange-400">--°C</h2>
            </div>
        
            <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
                <p class="text-gray-400 text-sm uppercase font-bold">Mínima do Dia</p>
                <h2 id="tempMin" class="text-3xl font-bold mt-2 text-blue-400">--°C</h2>
            </div>
        </div>
        <!-- FIM CARD Temperatura -->

        <h3 class="text-xl font-bold mb-4 text-blue-300">Previsão para os Próximos 7 Dias</h3>
        <div id="containerSemana" class="grid grid-cols-2 md:grid-cols-7 gap-3 mb-10">
        </div>

        <div class="bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">                
                <table class="w-full text-left">
                    <thead class="bg-gray-700 text-blue-300 uppercase text-sm">
                        <tr>
                            <th class="p-5 font-bold">Data/Hora</th>
                            <th class="p-5 font-bold text-center">Temperatura</th>
                            <th class="p-5 font-bold text-center">Sensação</th>
                            <th class="p-5 font-bold text-center">Umidade</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela" class="divide-y divide-gray-700">
                        <tr>
                            <td colspan="4" class="p-12 text-center text-gray-500">
                                Use o campo acima para pesquisar uma cidade...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
